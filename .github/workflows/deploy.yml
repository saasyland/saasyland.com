name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  tested:
    name: Tested before the merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Find whether the merge queue tested this commit
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/tested-commit.ts "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    needs: tested
    if: needs.tested.outputs.tested != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  deploy-preview:
    name: Deploy preview
    needs: [tested, checks]
    if: ${{ !cancelled() && needs.tested.result == 'success' && (needs.tested.outputs.tested == 'true' || needs.checks.result == 'success') }}
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      target: preview
    secrets: inherit

  deploy-production:
    name: Deploy production
    needs: [tested, checks, deploy-preview]
    if: ${{ !cancelled() && needs.deploy-preview.result == 'success' }}
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      target: production
    secrets: inherit

  release:
    name: Release
    needs: deploy-production
    if: ${{ !cancelled() && needs.deploy-production.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Tag the deployed commit and publish its release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.deploy-production.outputs.release-tag }}
        run: bun scripts/publish-release.ts "$GITHUB_SHA" "$RELEASE_TAG"
