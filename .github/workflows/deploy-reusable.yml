name: Deploy Cloudflare Worker

on:
  workflow_call:
    inputs:
      target:
        description: Wrangler environment to deploy (preview or production).
        required: true
        type: string
      upload:
        description: Upload the build as a new Worker version without deploying it, applying migrations or recording a GitHub deployment.
        required: false
        type: boolean
        default: false
    outputs:
      release-tag:
        description: Tag that the release job gives a production deploy, chosen before the build so its changelog can show it.
        value: ${{ jobs.deploy.outputs.release-tag }}

jobs:
  deploy:
    name: ${{ inputs.upload && 'Upload' || 'Deploy' }} ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.target == 'production' && 'Production' || 'Preview' }}
      url: ${{ inputs.target == 'production' && 'https://saasyland.com' || 'https://preview.saasyland.com' }}
      deployment: ${{ !inputs.upload }}
    concurrency:
      group: cloudflare-${{ inputs.upload && format('upload-{0}', github.run_id) || format('deploy-{0}', inputs.target) }}
      cancel-in-progress: false
      queue: max
    env:
      DEPLOY_TARGET: ${{ inputs.target }}
    outputs:
      release-tag: ${{ steps.release-tag.outputs.tag }}

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - name: Validate deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          case "$DEPLOY_TARGET" in
            preview|production) ;;
            *) echo "::error::Expected preview or production."; exit 1 ;;
          esac
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the GitHub Preview and Production environments. See README.md."
            exit 1
          fi

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Verify Cloudflare bindings
        run: bun scripts/verify-bindings.ts "$DEPLOY_TARGET"

      - name: Choose the release tag
        id: release-tag
        if: inputs.target == 'production'
        run: bun scripts/choose-release-tag.ts "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build Worker and verify artifacts
        env:
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          bun --env-file=.env.test run "build:$DEPLOY_TARGET"
          rm -f dist/server/.dev.vars

      - name: Apply D1 migrations
        if: ${{ !inputs.upload }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run "db:migrate:$DEPLOY_TARGET"

      - name: Deploy Worker
        if: ${{ !inputs.upload }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: vp exec wrangler deploy --config dist/server/wrangler.json

      - name: Upload Worker version
        if: inputs.upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_ALIAS: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          alias_arguments=()
          if [[ -n "$PREVIEW_ALIAS" ]]; then
            alias_arguments=(--preview-alias "$PREVIEW_ALIAS")
          fi
          vp exec wrangler versions upload --config dist/server/wrangler.json --message "$GITHUB_EVENT_NAME $GITHUB_SHA" "${alias_arguments[@]}"
          jq --raw-output 'select(.type == "version-upload") | "Uploaded version \(.version_id), \(.bundle_size.gzip_bytes // "an unknown number of") bytes gzipped. \(.preview_alias_url // .preview_url // "Version URLs are off for this Worker.")"' "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_STEP_SUMMARY"
