name: Feature request
description: Suggest a change to the website, the docs or the code.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and why it is hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you suggest, and any alternatives you considered.
    validations:
      required: true
