name: E2E (full)

on:
  push:
    branches:
      - main
  schedule:
    - cron: "15 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ github.event_name == 'push' && fromJSON('["webkit"]') || fromJSON('["chromium", "webkit"]') }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/e2e-reusable.yml
    with:
      browser: ${{ matrix.browser }}
