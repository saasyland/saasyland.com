name: Setup toolchain
description: Install Bun, Vite+, dependencies, and local Cloudflare test configuration.

inputs:
  bun-version:
    description: Bun version used by package.json.
    required: false
    default: "1.4.0"
  node-version:
    description: Node version for Vite+ and the SQLite test harness.
    required: false
    default: "24"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}
    - uses: voidzero-dev/setup-vp@v1
      with:
        node-version: ${{ inputs.node-version }}
        cache: true
        run-install: false
    - uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile --ignore-scripts
    - name: Configure isolated test environment
      shell: bash
      run: |
        cp .env.test .env.development
        cp .env.test .env.preview
        echo "VITE_APP_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
    - name: Generate binding and content types
      shell: bash
      run: bun run typegen
