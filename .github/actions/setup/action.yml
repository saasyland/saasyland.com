name: Setup toolchain
description: Install Bun, Vite+, dependencies, and local Cloudflare test configuration.

inputs:
  node-version:
    description: Node version for Vite+ and the SQLite test harness.
    required: false
    default: "24"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json
    - uses: voidzero-dev/setup-vp@v1.21.2
      with:
        node-version: ${{ inputs.node-version }}
        cache: true
        run-install: false
    - uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile --ignore-scripts
    - name: Generate binding and content types
      shell: bash
      run: bun run typegen
