name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, types, i18n, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Format, lint, typecheck, and i18n
        run: bun run check

      - name: Tests with coverage gate
        run: bun run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: Build and E2E
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-reusable.yml
    with:
      browser: chromium

  deploy-preview:
    name: Deploy preview
    needs: [verify, e2e]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      target: preview
    secrets: inherit

  deploy-production:
    name: Deploy production
    needs: [verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      target: production
    secrets: inherit
