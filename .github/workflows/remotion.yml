name: Landing video source

on:
  pull_request:
    paths:
      - "remotion/**"
      - "messages/en-US/navigation.*.json"
      - "messages/en-US/pages.admin.sidebar.json"
      - "src/data/navigation*.ts"
      - "src/data/cli.ts"
      - "src/data/landing-videos.ts"
      - "src/integrations/use-intl/i18n.config.ts"
      - "src/presentation/branding/index.ts"
      - "src/routes.ts"
      - ".github/workflows/remotion.yml"
  push:
    branches:
      - main
    paths:
      - "remotion/**"
      - "messages/en-US/navigation.*.json"
      - "messages/en-US/pages.admin.sidebar.json"
      - "src/data/navigation*.ts"
      - "src/data/cli.ts"
      - "src/data/landing-videos.ts"
      - "src/integrations/use-intl/i18n.config.ts"
      - "src/presentation/branding/index.ts"
      - "src/routes.ts"
      - ".github/workflows/remotion.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, types, bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run bundle
