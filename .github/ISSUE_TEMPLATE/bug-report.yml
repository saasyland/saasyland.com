name: Bug report
description: Something on saasyland.com or in this code does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened
      description: What you expected, what happened instead, and any error message or log.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Where
      description: The page URL, or the commit of your copy of the code.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and operating system, plus the Bun and Node versions if you ran the code.
    validations:
      required: true
